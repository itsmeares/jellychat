overview: "Chat for Jellyfin SyncPlay watch parties."
description: >
  Adds chat to Jellyfin web clients for SyncPlay sessions using a
  plugin-owned in-memory event stream. It does not use Jellyfin toast chat
  transport, an external WebSocket server, or additional network ports.
category: "General"
owner: "itsmeares"
artifacts:
- "Jellyfin.Plugin.JellyChat.dll"
changelog: >
  JellyChat 3.0 is a full rewrite of the chat panel. New Violet and Glass themes plus an admin Custom theme, docked or floating layouts, a phone bottom sheet, emoji search with favorites, and per-user settings saved on your Jellyfin account. Chat now uses one long-poll request instead of polling every 850 ms. Requires Jellyfin 12. Custom CSS written for 2.x class names needs updating.
