overview: "JellyChat drawer for Jellyfin SyncPlay sessions."
description: >
  Adds a JellyChat drawer to Jellyfin web clients for SyncPlay sessions using a
  plugin-owned in-memory event stream. It does not use Jellyfin toast chat
  transport, an external WebSocket server, or additional network ports.
category: "General"
owner: "itsmeares"
artifacts:
- "Jellyfin.Plugin.JellyChat.dll"
changelog: >
  Adds room password protection with automatic owner handoff and session-scoped
  access. Cleans up temporary room state when sessions end, hardens password and
  membership changes against concurrency races, and keeps the password field
  focused during room polling.
