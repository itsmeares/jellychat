name: Refresh JellyChat frontend assets

on:
  push:
    branches:
      - fix/jf12-trigger-recovery

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/jf12-trigger-recovery
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web-src/package-lock.json
      - working-directory: web-src
        run: npm ci
      - working-directory: web-src
        run: npm run build
      - name: Commit generated assets
        run: |
          if git diff --quiet -- Jellyfin.Plugin.JellyChat/Web/jellychat.js Jellyfin.Plugin.JellyChat/Web/jellychat.css; then
            echo "Frontend assets already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Jellyfin.Plugin.JellyChat/Web/jellychat.js Jellyfin.Plugin.JellyChat/Web/jellychat.css
          git commit -m "build: refresh JellyChat frontend assets"
          git push origin HEAD:fix/jf12-trigger-recovery
