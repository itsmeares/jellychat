name: "🚀 Release"

on:
  release:
    types:
      - published

jobs:
  update-manifest:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Parse version from release tag
        id: version
        run: |
          TAG="${{ github.event.release.tag_name }}"
          VERSION="${TAG#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Download release asset and compute checksum
        run: |
          ASSET_NAME="Jellyfin.Plugin.JellyChat_${{ steps.version.outputs.version }}.zip"
          gh release download "${{ github.event.release.tag_name }}" \
            --pattern "${ASSET_NAME}" \
            --dir /tmp
          MD5=$(md5sum "/tmp/${ASSET_NAME}" | awk '{print $1}')
          echo "checksum=${MD5}" >> "$GITHUB_ENV"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update manifest.json
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const manifest = JSON.parse(fs.readFileSync('manifest.json', 'utf8'));
            const version = '${{ steps.version.outputs.version }}';
            const checksum = process.env.checksum;
            const body = context.payload.release.body || '';
            const changelog = body.replace(/\r\n/g, ' ').replace(/\n/g, ' ').replace(/\s+/g, ' ').trim();
            const now = new Date().toISOString().replace(/\.\d{3}Z$/, '');
            const sourceUrl = `https://github.com/${{ github.repository }}/releases/download/${{ github.event.release.tag_name }}/Jellyfin.Plugin.JellyChat_${version}.zip`;

            const newEntry = {
              changelog,
              targetAbi: '10.11.0.0',
              version,
              sourceUrl,
              checksum,
              timestamp: now
            };

            manifest[0].versions = manifest[0].versions.filter(entry => entry.version !== version);
            manifest[0].versions.unshift(newEntry);
            fs.writeFileSync('manifest.json', JSON.stringify(manifest, null, 4) + '\n');

      - name: Update Directory.Build.props
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          sed -i "s|<Version>.*</Version>|<Version>${VERSION}</Version>|" Directory.Build.props
          sed -i "s|<AssemblyVersion>.*</AssemblyVersion>|<AssemblyVersion>${VERSION}</AssemblyVersion>|" Directory.Build.props
          sed -i "s|<FileVersion>.*</FileVersion>|<FileVersion>${VERSION}</FileVersion>|" Directory.Build.props

      - name: Create manifest update pull request
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          BRANCH="automation/update-manifest-${VERSION}"
          TITLE="release: update manifest and version to ${VERSION}"
          BODY_FILE="/tmp/jellychat-release-pr-body.md"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git checkout -B "${BRANCH}"

          git add manifest.json Directory.Build.props
          if git diff --cached --quiet; then
            echo "No release metadata changes to publish."
            exit 0
          fi

          git commit -m "${TITLE}"
          git push --force-with-lease origin "${BRANCH}"

          cat > "${BODY_FILE}" <<EOF
          ## Summary
          - Add/update JellyChat ${VERSION} release metadata
          - Point manifest to the published release asset
          - Use checksum ${checksum}

          ## Validation
          - Release workflow downloaded Jellyfin.Plugin.JellyChat_${VERSION}.zip
          - Release workflow computed checksum ${checksum}
          - Release workflow updated manifest.json and Directory.Build.props
          EOF

          PR_NUMBER=$(gh pr list \
            --repo "${{ github.repository }}" \
            --head "${BRANCH}" \
            --base main \
            --state open \
            --json number \
            --jq '.[0].number // ""')

          if [ -n "${PR_NUMBER}" ]; then
            gh pr edit "${PR_NUMBER}" \
              --repo "${{ github.repository }}" \
              --title "${TITLE}" \
              --body-file "${BODY_FILE}"
            echo "Updated existing release metadata PR #${PR_NUMBER}."
          else
            gh pr create \
              --repo "${{ github.repository }}" \
              --base main \
              --head "${BRANCH}" \
              --title "${TITLE}" \
              --body-file "${BODY_FILE}"
          fi
        env:
          # Optional PAT/GitHub App token. Falls back to GITHUB_TOKEN if unset.
          GH_TOKEN: ${{ secrets.RELEASE_PR_TOKEN || secrets.GITHUB_TOKEN }}
