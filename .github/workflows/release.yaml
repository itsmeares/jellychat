name: "🚀 Release"

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without the leading v (for example, 2.1.2)"
        required: true
        type: string
      changelog:
        description: "Concise user-facing release notes used in release metadata"
        required: true
        type: string
      prerelease:
        description: "Publish as a prerelease"
        required: true
        default: false
        type: boolean

concurrency:
  group: jellychat-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate release inputs
        env:
          CHANGELOG_INPUT: ${{ inputs.changelog }}
          RELEASE_VERSION_INPUT: ${{ inputs.version }}
        run: |
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "Release workflow must be run from main." >&2
            exit 1
          fi

          if [[ ! "${RELEASE_VERSION_INPUT}" =~ ^([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "Release version must use MAJOR.MINOR.PATCH, for example 2.1.2." >&2
            exit 1
          fi

          if [[ -z "${CHANGELOG_INPUT//[[:space:]]/}" ]]; then
            echo "Changelog must not be empty." >&2
            exit 1
          fi

          RELEASE_VERSION="${BASH_REMATCH[1]}"
          PLUGIN_VERSION="${RELEASE_VERSION}.0"
          TAG_NAME="v${RELEASE_VERSION}"
          ASSET_NAME="Jellyfin.Plugin.JellyChat_${RELEASE_VERSION}.zip"
          echo "RELEASE_VERSION=${RELEASE_VERSION}" >> "${GITHUB_ENV}"
          echo "PLUGIN_VERSION=${PLUGIN_VERSION}" >> "${GITHUB_ENV}"
          echo "TAG_NAME=${TAG_NAME}" >> "${GITHUB_ENV}"
          echo "ASSET_NAME=${ASSET_NAME}" >> "${GITHUB_ENV}"

      - name: Reject an existing release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git show-ref --verify --quiet "refs/tags/${TAG_NAME}" || gh release view "${TAG_NAME}" > /dev/null 2>&1; then
            echo "Tag or release ${TAG_NAME} already exists." >&2
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web-src/package-lock.json

      - name: Prepare release metadata
        uses: actions/github-script@v7
        env:
          CHANGELOG_INPUT: ${{ inputs.changelog }}
        with:
          script: |
            const fs = require('fs');
            const releaseVersion = process.env.RELEASE_VERSION;
            const pluginVersion = process.env.PLUGIN_VERSION;
            const changelog = process.env.CHANGELOG_INPUT.replace(/\r\n/g, ' ').replace(/\n/g, ' ').replace(/\s+/g, ' ').trim();

            let buildProps = fs.readFileSync('Directory.Build.props', 'utf8');
            for (const field of ['Version', 'AssemblyVersion', 'FileVersion']) {
              const pattern = new RegExp(`<${field}>[^<]+</${field}>`);
              if (!pattern.test(buildProps)) {
                throw new Error(`Directory.Build.props is missing ${field}.`);
              }
              buildProps = buildProps.replace(pattern, `<${field}>${pluginVersion}</${field}>`);
            }
            fs.writeFileSync('Directory.Build.props', buildProps);

            let buildMetadata = fs.readFileSync('build.yaml', 'utf8');
            const buildChangelog = /^changelog:\s*>\s*\n(?:[ \t]+.*(?:\n|$))+/m;
            if (!/^version:\s*["']?\d+\.\d+\.\d+\.\d+["']?\s*$/m.test(buildMetadata) || !buildChangelog.test(buildMetadata)) {
              throw new Error('build.yaml must contain version and changelog fields.');
            }
            buildMetadata = buildMetadata
              .replace(/^version:.*$/m, `version: "${pluginVersion}"`)
              .replace(buildChangelog, `changelog: >\n  ${changelog}\n`);
            fs.writeFileSync('build.yaml', buildMetadata);

            const packageJson = JSON.parse(fs.readFileSync('web-src/package.json', 'utf8'));
            const packageLock = JSON.parse(fs.readFileSync('web-src/package-lock.json', 'utf8'));
            if (!packageLock.packages?.['']) {
              throw new Error('web-src/package-lock.json is missing the root package.');
            }
            packageJson.version = releaseVersion;
            packageLock.version = releaseVersion;
            packageLock.packages[''].version = releaseVersion;
            fs.writeFileSync('web-src/package.json', JSON.stringify(packageJson, null, 2) + '\n');
            fs.writeFileSync('web-src/package-lock.json', JSON.stringify(packageLock, null, 2) + '\n');

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build frontend assets
        working-directory: web-src
        run: |
          npm ci
          npm run build

      - name: Verify frontend assets
        run: git diff --exit-code -- Jellyfin.Plugin.JellyChat/Web/jellychat.js Jellyfin.Plugin.JellyChat/Web/jellychat.css

      - name: Test plugin
        run: dotnet test Jellyfin.Plugin.JellyChat.Tests/Jellyfin.Plugin.JellyChat.Tests.csproj -c Release

      - name: Publish plugin
        run: dotnet publish Jellyfin.Plugin.JellyChat/Jellyfin.Plugin.JellyChat.csproj -c Release

      - name: Package plugin and compute checksum
        run: |
          mkdir -p artifacts
          (
            cd Jellyfin.Plugin.JellyChat/bin/Release/net10.0/publish
            zip -q -r "${GITHUB_WORKSPACE}/artifacts/${ASSET_NAME}" .
          )
          CHECKSUM=$(md5sum "artifacts/${ASSET_NAME}" | awk '{print $1}')
          echo "CHECKSUM=${CHECKSUM}" >> "${GITHUB_ENV}"

      - name: Update manifest.json
        uses: actions/github-script@v7
        env:
          CHANGELOG_INPUT: ${{ inputs.changelog }}
        with:
          script: |
            const fs = require('fs');
            const manifest = JSON.parse(fs.readFileSync('manifest.json', 'utf8'));
            const releaseVersion = process.env.RELEASE_VERSION;
            const pluginVersion = process.env.PLUGIN_VERSION;
            const buildMetadata = fs.readFileSync('build.yaml', 'utf8');
            const targetAbiMatch = buildMetadata.match(/^targetAbi:\s*["']?(\d+\.\d+\.\d+\.\d+)["']?\s*$/m);
            if (!targetAbiMatch) {
              core.setFailed('build.yaml must contain a four-part targetAbi.');
              return;
            }

            const targetAbi = targetAbiMatch[1];
            const changelog = process.env.CHANGELOG_INPUT.replace(/\r\n/g, ' ').replace(/\n/g, ' ').replace(/\s+/g, ' ').trim();
            const now = new Date().toISOString().replace(/\.\d{3}Z$/, '');
            const sourceUrl = `https://github.com/${{ github.repository }}/releases/download/${process.env.TAG_NAME}/Jellyfin.Plugin.JellyChat_${releaseVersion}.zip`;
            const newEntry = {
              changelog,
              targetAbi,
              version: pluginVersion,
              sourceUrl,
              checksum: process.env.CHECKSUM,
              timestamp: now
            };

            manifest[0].versions = manifest[0].versions.filter(entry => entry.version !== pluginVersion && entry.version !== releaseVersion);
            manifest[0].versions.unshift(newEntry);
            fs.writeFileSync('manifest.json', JSON.stringify(manifest, null, 4) + '\n');

      - name: Commit release metadata
        run: |
          BRANCH="automation/update-manifest-${PLUGIN_VERSION}"
          TITLE="release: update manifest and version to ${PLUGIN_VERSION}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git checkout -B "${BRANCH}"

          git add manifest.json Directory.Build.props build.yaml web-src/package.json web-src/package-lock.json
          if git diff --cached --quiet; then
            echo "No release metadata changes to publish." >&2
            exit 1
          fi

          git commit -m "${TITLE}"
          git push --force-with-lease origin "${BRANCH}"
          echo "RELEASE_BRANCH=${BRANCH}" >> "${GITHUB_ENV}"
          echo "RELEASE_COMMIT=$(git rev-parse HEAD)" >> "${GITHUB_ENV}"
          echo "RELEASE_TITLE=${TITLE}" >> "${GITHUB_ENV}"
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PR_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Create draft release
        env:
          CHANGELOG_INPUT: ${{ inputs.changelog }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRERELEASE_INPUT: ${{ inputs.prerelease }}
        run: |
          printf '%s\n' "${CHANGELOG_INPUT}" > /tmp/jellychat-release-notes.md
          FLAGS=(--draft)
          if [[ "${PRERELEASE_INPUT}" == "true" ]]; then
            FLAGS+=(--prerelease)
          fi
          gh release create "${TAG_NAME}" "artifacts/${ASSET_NAME}" \
            --target "${RELEASE_COMMIT}" \
            --title "JellyChat ${TAG_NAME}" \
            --notes-file /tmp/jellychat-release-notes.md \
            "${FLAGS[@]}"

      - name: Create release metadata pull request
        run: |
          BODY_FILE="/tmp/jellychat-release-pr-body.md"

          cat > "${BODY_FILE}" <<EOF
          ## Summary
          - Add/update JellyChat ${PLUGIN_VERSION} plugin metadata
          - Point manifest to the ${RELEASE_VERSION} release asset
          - Use checksum ${CHECKSUM}

          ## Validation
          - Release workflow built and tested the plugin on GitHub Actions
          - Release workflow created Jellyfin.Plugin.JellyChat_${RELEASE_VERSION}.zip
          - Release workflow computed checksum ${CHECKSUM}
          - Release workflow updated manifest.json and all version metadata
          EOF

          PR_NUMBER=$(gh pr list \
            --repo "${{ github.repository }}" \
            --head "${RELEASE_BRANCH}" \
            --base main \
            --state open \
            --json number \
            --jq '.[0].number // ""')

          if [ -n "${PR_NUMBER}" ]; then
            gh pr edit "${PR_NUMBER}" \
              --repo "${{ github.repository }}" \
              --title "${RELEASE_TITLE}" \
              --body-file "${BODY_FILE}"
            echo "Updated existing release metadata PR #${PR_NUMBER}."
          else
            gh pr create \
              --repo "${{ github.repository }}" \
              --base main \
              --head "${RELEASE_BRANCH}" \
              --title "${RELEASE_TITLE}" \
              --body-file "${BODY_FILE}"
          fi
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PR_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${TAG_NAME}" --draft=false
