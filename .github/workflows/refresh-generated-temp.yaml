name: Refresh generated frontend assets

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'web-src/**'
      - 'Jellyfin.Plugin.JellyChat/Web/jellychat.js'
      - 'Jellyfin.Plugin.JellyChat/Web/jellychat.css'

permissions:
  contents: write

jobs:
  refresh:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web-src/package-lock.json

      - name: Build frontend
        working-directory: web-src
        run: |
          npm ci
          npm run build

      - name: Commit generated assets if needed
        run: |
          if git diff --quiet -- Jellyfin.Plugin.JellyChat/Web/jellychat.js Jellyfin.Plugin.JellyChat/Web/jellychat.css; then
            echo 'Generated assets already match source.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Jellyfin.Plugin.JellyChat/Web/jellychat.js Jellyfin.Plugin.JellyChat/Web/jellychat.css
          git commit -m 'build: refresh JellyChat frontend assets'
          git push origin HEAD:${{ github.head_ref }}
