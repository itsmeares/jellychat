name: '🏗️ Build Plugin'

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web-src/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: web-src
        run: npm ci

      - name: Build Frontend Assets
        working-directory: web-src
        run: npm run build

      - name: Verify Frontend Assets
        run: git diff --exit-code -- Jellyfin.Plugin.JellyChat/Web/jellychat.js Jellyfin.Plugin.JellyChat/Web/jellychat.css

  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Run JellyChat Tests
        run: dotnet test Jellyfin.Plugin.JellyChat.Tests/Jellyfin.Plugin.JellyChat.Tests.csproj -c Release

  call:
    needs:
      - frontend
      - tests
    uses: jellyfin/jellyfin-meta-plugins/.github/workflows/build.yaml@master
    with:
      dotnet-version: '10.0.x'
      dotnet-target: 'net10.0'
