name: '🏗️ Build Plugin'

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web-src/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: web-src
        run: npm ci

      - name: Test Frontend
        working-directory: web-src
        run: npm test

      - name: Test Release Notes
        run: node --test scripts/release-notes.test.mjs

      - name: Build Frontend Assets
        working-directory: web-src
        run: npm run build

      - name: Verify Frontend Assets
        run: git diff --exit-code -- Jellyfin.Plugin.JellyChat/Web/jellychat.js Jellyfin.Plugin.JellyChat/Web/jellychat.css

  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'

      - name: Run JellyChat Tests
        run: dotnet test Jellyfin.Plugin.JellyChat.Tests/Jellyfin.Plugin.JellyChat.Tests.csproj -c Release

  call:
    needs:
      - frontend
      - tests
    uses: jellyfin/jellyfin-meta-plugins/.github/workflows/build.yaml@5f6990aa467ae0a6b62c91ad0502e3e1a53117ce # master
    with:
      dotnet-version: '10.0.x'
      dotnet-target: 'net10.0'
